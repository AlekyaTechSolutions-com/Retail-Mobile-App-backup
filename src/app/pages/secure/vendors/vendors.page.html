<ion-header class="vendor-header">
  <ion-toolbar>

  <ion-buttons slot="start">
    <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
  </ion-buttons>

  <ion-title class="ion-text-start">Vendors</ion-title>

  <ion-buttons slot="end">
    <ion-button class="assignment-mode-button" (click)="toggleAssignmentMode()">
      <ion-icon [name]="assignmentMode ? 'checkmark-outline' : 'create-outline'"></ion-icon>
      {{ assignmentMode ? 'Done' : 'Edit' }}
    </ion-button>
  </ion-buttons>

</ion-toolbar>

  <div class="header-search search-wrapper">
  <ion-icon name="search-outline"></ion-icon>
  <input
    type="text"
    placeholder="Search by name"
    (input)="search($event)">
</div>
</ion-header>

<ion-content>
  <div class="store-assignment-heading" *ngIf="selectedStoreName">
    <div><strong>{{ selectedStoreName }}</strong><span>Choose which vendors are available at this store.</span></div>
    <span class="assignment-count">{{ mappedVendors.length }} assigned</span>
  </div>
  <div *ngIf="loadError" class="ion-text-center ion-padding" role="alert">
    <p>{{ loadError }}</p>
    <ion-button size="small" (click)="loadVendors()">Retry</ion-button>
  </div>

  <!-- LOADING STATE -->
  <div *ngIf="loading && filteredVendors.length === 0" class="loader-wrapper">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- EMPTY STATE -->
  <div
    *ngIf="!loading && !loadError && filteredVendors.length === 0"
    class="empty-state"
  >
    <ion-icon name="storefront-outline"></ion-icon>
    <h3>No vendors found</h3>
    <p>Try changing your search.</p>
  </div>

  <div class="card-container">

    <div
      class="vendor-card"
      *ngFor="let vendor of filteredVendors; let i = index"
      [style.border-bottom]="'4px solid ' + getAccentColor(i)"
    >

      <!-- TOP ROW -->
      <div class="top-row">

        <div class="left">
          <div class="avatar" [style.background]="getAccentColor(i)">
            <ion-icon name="bag-handle-outline"></ion-icon>
          </div>

          <div class="vendor-info">
            <div class="name">
              {{ vendor.vendor_name }}
            </div>
          </div>
        </div>

        <label class="assignment-toggle" *ngIf="assignmentMode" (click)="$event.stopPropagation()" [attr.aria-label]="(isMapped(vendor) ? 'Unmap ' : 'Map ') + vendor.vendor_name">
          <input type="checkbox" [checked]="isMapped(vendor)" [disabled]="savingAssignments.size > 0 || loading" (change)="toggleStoreMapping(vendor, $event)" />
          <span class="assignment-checkmark"><ion-spinner *ngIf="savingAssignments.has(vendorId(vendor))" name="crescent"></ion-spinner><ion-icon *ngIf="!savingAssignments.has(vendorId(vendor))" name="checkmark-outline"></ion-icon></span>
        </label>

        <!-- <div class="type"
             [class.purchase]="vendor.type === 'purchase'"
             [class.expense]="vendor.type === 'expense'">
          ● {{ vendor.type | titlecase }}
        </div> -->

      </div>

      <!-- MIDDLE ROW -->
      <!-- <div class="middle-row">
        <div>Amount: <strong>${{ vendor.amount }}</strong></div>
        <div>Payment Method: <strong>{{ vendor.payment_method }}</strong></div>
      </div> -->

      <!-- <div class="divider"></div> -->

      <!-- BOTTOM ROW -->
      <!-- <div class="bottom-row">

        <div class="note">
          Note: {{ vendor.note || 'Paid in full purchase' }}
        </div>

      </div> -->

    </div>

  </div>

</ion-content>
